[http]
listen = 0.0.0.0:8080

[app]
debug = false

[sessions]
hashkey = HASHKEY
blockkey = BLOCKKEY

[clients]
# Shared secret for connections from internal clients.
internalsecret = INTERNALSECRET

[backend]
# Comma-separated list of backend ids. Add more as backend-2, backend-3, ...
backends = backend-1
allowall = false
timeout = 10
connectionsperhost = 8

[backend-1]
urls = NEXTCLOUDSERVER
secret = SHAREDSECRET

#[backend-2]
#urls = https://nextcloud2.example.com
#secret = openssl rand -hex 16

#[backend-3]
#urls = https://nextcloud3.example.com
#secret = openssl rand -hex 16


[nats]
url = nats://nats:4222

[mcu]
type = janus
url = ws://janus:8188
# Janus rewrites its host candidate to the public IP via --nat-1-1, so private
# candidates should never reach clients. Filtered here as a belt-and-braces
# measure to keep ICE from wasting time on unreachable addresses.
blockedcandidates = 172.16.0.0/12

[turn]
# Consumed by the /turn/credentials TURN REST API endpoint, which only Janus
# would call (and only if janus.jcfg sets turn_rest_api, which it does not).
# Browser clients get their STUN/TURN configuration from the Nextcloud Talk
# admin settings instead. Container name is correct here.
apikey = APIKEY
secret = STATICSECRET
servers = turn:coturn:3478?transport=udp,turn:coturn:3478?transport=tcp
