upstream signaling {
    server spreedbackend:8080;
}

# Port 80 exists only to serve ACME http-01 challenges and to redirect
# everything else. The challenge location must come before the redirect or
# certbot can never validate.
server {
    listen 80;
    server_name SIGNALFQDN;

    # Webroot shared with certbot. Host path: ./nginx/conf/www
    # Must match --webroot-path in certbot_certificate_*.sh and certbot_renew.sh
    location /.well-known/acme-challenge/ {
        root /config/www;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name SIGNALFQDN;

    root /config/www;

    # certbot_certificate_production.sh rewrites "dummy" to "live" here once a
    # real certificate has been issued.
    ssl_certificate /etc/nginx/ssl/dummy/SIGNALFQDN/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dummy/SIGNALFQDN/privkey.pem;

    # Deliberately NOT including /config/nginx/ssl.conf: it hardcodes
    # "ssl_certificate /config/keys/cert.crt", which would override the paths
    # above and stop nginx from starting.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location /standalone-signaling/ {
        proxy_pass http://signaling/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /standalone-signaling/spreed {
        proxy_pass http://signaling/spreed;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Signaling websockets are long-lived; don't let nginx cull them.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
